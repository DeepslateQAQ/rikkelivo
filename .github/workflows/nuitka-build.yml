name: 使用 Nuitka 构建 rikkelivo 二进制

on:
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: nuitka-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nuitka:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runs-on: ubuntu-22.04 # glibc >= 2.34
            build: scripts/build.sh
            artifact: build/linux/rikkelivo
            check: ./build/linux/rikkelivo --help
            deps: patchelf ccache
          - target: linux-arm64
            runs-on: ubuntu-22.04-arm
            build: scripts/build.sh
            artifact: build/linux/rikkelivo
            check: ./build/linux/rikkelivo --help
            deps: patchelf ccache
          - target: windows-amd64
            runs-on: windows-2022
            build: powershell -ExecutionPolicy Bypass -File scripts/build.ps1
            artifact: build/win/rikkelivo.exe
            check: .\build\win\rikkelivo.exe --help
            deps: ""
          - target: darwin-amd64
            runs-on: macos-15-intel # Intel
            build: scripts/build.sh
            artifact: build/macos/rikkelivo
            check: ./build/macos/rikkelivo --help
            deps: ""
          - target: darwin-arm64
            runs-on: macos-latest # Apple Silicon
            build: scripts/build.sh
            artifact: build/macos/rikkelivo
            check: ./build/macos/rikkelivo --help
            deps: ""

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install build deps
        if: matrix.deps != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ${{ matrix.deps }}

      - name: Sync project deps (incl. build group)
        run: uv sync --frozen --no-dev --group build

      - name: Restore Nuitka / ccache caches
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/Nuitka
            ~/.cache/ccache
          key: nuitka-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('src/rikkelivo/**', 'pyproject.toml', 'uv.lock') }}
          restore-keys: |
            nuitka-${{ runner.os }}-

      - name: Build single-file binary (${{ matrix.target }})
        run: ${{ matrix.build }}

      - name: Check build artifact
        run: ${{ matrix.check }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: rikkelivo-nuitka-${{ matrix.target }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
