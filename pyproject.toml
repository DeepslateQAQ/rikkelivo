[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rikkelivo"
version = "0.1.0"
description = "Backup converter between RikkaHub, Kelivo and Cuplivo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "questionary==2.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
build = [
    "nuitka>=2.0",
    "zstandard>=0.22",
]

[project.scripts]
rikkelivo = "rikkelivo.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rikkelivo = ["schemas/**/*.json", "schemas/README.md"]
